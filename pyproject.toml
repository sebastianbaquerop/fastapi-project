[project]
name = "take-home-challenge"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
]
[tool.fastapi]
entrypoint = "app.main:app"
[tool.pytest.ini_options]
pythonpath = ["/src"]
[tool.ruff]
line-length = 77
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008", # Permite poner llamadas a funciones en argumentos (ej: Depends(get_db))
]
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
[tool.ruff.format]
quote-style = "double"
